---
- name: Restart Hermes runtime gateway
  become: true
  ansible.builtin.systemd_service:
    name: hermes-gateway
    state: restarted
    daemon_reload: true

- name: Restart Hermes runtime dashboard
  become: true
  ansible.builtin.systemd_service:
    name: hermes-dashboard
    state: restarted
    daemon_reload: true
