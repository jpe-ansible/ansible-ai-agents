---
hermes_runtime_version: "2026.9.11"
hermes_runtime_version_tag: "v{{ hermes_runtime_version }}"
hermes_runtime_repo_url: https://github.com/NousResearch/hermes-agent.git
hermes_runtime_installer_url: >-
  https://raw.githubusercontent.com/NousResearch/hermes-agent/{{
  hermes_runtime_version_tag }}/scripts/install.sh
hermes_runtime_installer_sha256: "5854b15670b51a8daae8f59ddfa917062de9f74be261eb73b4b8d719710f8968"
hermes_runtime_installer_path: "/usr/local/lib/hermes-agent-installer-{{ hermes_runtime_version }}.sh"
hermes_runtime_install_dir: /usr/local/lib/hermes-agent
hermes_runtime_bin: /usr/local/bin/hermes
hermes_runtime_dashboard_web_dist: "{{ hermes_runtime_install_dir }}/hermes_cli/web_dist"
hermes_runtime_systemd_unit_dir: /etc/systemd/system
hermes_runtime_gateway_unit_path: "{{ hermes_runtime_systemd_unit_dir }}/hermes-gateway.service"
hermes_runtime_dashboard_unit_path: "{{ hermes_runtime_systemd_unit_dir }}/hermes-dashboard.service"
hermes_runtime_gateway_restart_handler: Restart Hermes runtime gateway
hermes_runtime_dashboard_restart_handler: Restart Hermes runtime dashboard
hermes_runtime_unit_on_failure: ""
hermes_runtime_gateway_environment: []
hermes_runtime_dashboard_environment: []
hermes_runtime_gateway_after_user_manager: false
