---
- name: Fetch the pinned Hermes installer with checksum verification
  become: true
  ansible.builtin.get_url:
    url: "{{ hermes_runtime_installer_url }}"
    dest: "{{ hermes_runtime_installer_path }}"
    checksum: "sha256:{{ hermes_runtime_installer_sha256 }}"
    owner: root
    group: root
    mode: "0644"

- name: Run the verified installer for a missing Hermes CLI
  become: true
  ansible.builtin.command:
    argv:
      - bash
      - "{{ hermes_runtime_installer_path }}"
      - --branch
      - "{{ hermes_runtime_version_tag }}"
      - --skip-setup
      - --non-interactive
      - --skip-computer-use
    creates: "{{ hermes_runtime_bin }}"
  # A hung installer fails this host alone instead of stalling every host in the play.
  timeout: "{{ hermes_runtime_installer_timeout }}"

- name: Read Hermes CLI version before pinning
  become: true
  ansible.builtin.command:
    argv:
      - "{{ hermes_runtime_bin }}"
      - --version
  check_mode: false
  changed_when: false
  failed_when: false
  register: hermes_runtime_installed_version_before_pin

- name: Pin the Hermes checkout to the requested release tag
  become: true
  ansible.builtin.git:
    repo: "{{ hermes_runtime_repo_url }}"
    dest: "{{ hermes_runtime_install_dir }}"
    version: "{{ hermes_runtime_version_tag }}"
    refspec: "+refs/tags/{{ hermes_runtime_version_tag }}:refs/tags/{{ hermes_runtime_version_tag }}"
    depth: 1
    force: true
  register: hermes_runtime_checkout
  when:
    - >-
      hermes_runtime_installed_version_before_pin.rc != 0 or
      ('Hermes Agent v' ~ hermes_runtime_version ~ ' (') not in
      (hermes_runtime_installed_version_before_pin.stdout | default(''))
    - not ansible_check_mode or hermes_runtime_installed_version_before_pin.rc == 0

- name: Read the PM-pinned Python from the Hermes checkout
  become: true
  ansible.builtin.slurp:
    src: "{{ hermes_runtime_install_dir }}/pm/lock.json"
  check_mode: false
  register: hermes_runtime_pm_lock
  when:
    - not ansible_check_mode or hermes_runtime_installed_version_before_pin.rc == 0

- name: Read the Python minor of the Hermes runtime virtualenv before pinning
  become: true
  ansible.builtin.command:
    argv:
      - "{{ hermes_runtime_install_dir }}/venv/bin/python"
      - -c
      - "import sys; print('%d.%d' % sys.version_info[:2])"
  check_mode: false
  changed_when: false
  failed_when: false
  register: hermes_runtime_venv_python_before_pin
  when:
    - not ansible_check_mode or hermes_runtime_installed_version_before_pin.rc == 0

- name: Set the PM-pinned Python minor
  ansible.builtin.set_fact:
    hermes_runtime_pm_python: >-
      {{ (hermes_runtime_pm_lock.content | b64decode | from_json).packages.python.version.split('.')[:2] | join('.') }}
  when:
    - not ansible_check_mode or hermes_runtime_installed_version_before_pin.rc == 0

- name: Flag a runtime virtualenv whose Python differs from the PM pin
  ansible.builtin.set_fact:
    hermes_runtime_python_stale: >-
      {{ hermes_runtime_venv_python_before_pin.rc != 0 or
      (hermes_runtime_venv_python_before_pin.stdout | trim) != hermes_runtime_pm_python }}
  when:
    - not ansible_check_mode or hermes_runtime_installed_version_before_pin.rc == 0

# The checkout is already pinned above; the installer's repository stage would fetch
# the tag as a branch, so a rerun runs every other non-interactive stage instead.
- name: Install or upgrade Hermes when the checkout moved or its runtime Python is stale
  become: true
  ansible.builtin.command:
    argv:
      - bash
      - "{{ hermes_runtime_installer_path }}"
      - --stage
      - "{{ item }}"
      - --skip-setup
      - --non-interactive
      - --skip-computer-use
  loop: [prerequisites, venv, python-deps, config, products, complete]
  # Runs only when the version or venv Python is off the pin, so every run changes the install.
  changed_when: true
  timeout: "{{ hermes_runtime_installer_timeout }}"
  when:
    - >-
      hermes_runtime_installed_version_before_pin.rc != 0 or
      ('Hermes Agent v' ~ hermes_runtime_version ~ ' (') not in
      (hermes_runtime_installed_version_before_pin.stdout | default('')) or
      hermes_runtime_python_stale | default(false)
    - not ansible_check_mode or hermes_runtime_installed_version_before_pin.rc == 0

- name: Read the installed Hermes CLI version
  become: true
  ansible.builtin.command:
    argv:
      - "{{ hermes_runtime_bin }}"
      - --version
  check_mode: false
  changed_when: false
  register: hermes_runtime_installed_version
  when:
    - not (ansible_check_mode and hermes_runtime_checkout is changed)
    - not ansible_check_mode or hermes_runtime_installed_version_before_pin.rc == 0

- name: Assert the installed CLI reports the pinned release
  ansible.builtin.assert:
    quiet: true
    that:
      - "('Hermes Agent v' ~ hermes_runtime_version ~ ' (') in hermes_runtime_installed_version.stdout"
    fail_msg: >-
      {{ hermes_runtime_bin }} --version reported
      "{{ hermes_runtime_installed_version.stdout | trim }}", which does not
      contain "Hermes Agent v{{ hermes_runtime_version }} (", the pinned release.
  when:
    - not (ansible_check_mode and hermes_runtime_checkout is changed)
    - not ansible_check_mode or hermes_runtime_installed_version_before_pin.rc == 0

- name: Read the Python minor of the Hermes runtime virtualenv after install
  become: true
  ansible.builtin.command:
    argv:
      - "{{ hermes_runtime_install_dir }}/venv/bin/python"
      - -c
      - "import sys; print('%d.%d' % sys.version_info[:2])"
  check_mode: false
  changed_when: false
  failed_when: false
  register: hermes_runtime_venv_python
  when:
    - not (ansible_check_mode and hermes_runtime_checkout is changed)
    - not ansible_check_mode or hermes_runtime_installed_version_before_pin.rc == 0

- name: Assert the runtime virtualenv runs the PM-pinned Python
  ansible.builtin.assert:
    quiet: true
    that:
      - hermes_runtime_venv_python.rc == 0
      - (hermes_runtime_venv_python.stdout | trim) == hermes_runtime_pm_python
    fail_msg: >-
      {{ hermes_runtime_install_dir }}/venv reports Python
      "{{ hermes_runtime_venv_python.stdout | default('') | trim }}"
      (rc {{ hermes_runtime_venv_python.rc | default('none') }}),
      but pm/lock.json pins Python {{ hermes_runtime_pm_python }}.
  when:
    - not (ansible_check_mode and hermes_runtime_checkout is changed)
    - not ansible_check_mode or hermes_runtime_installed_version_before_pin.rc == 0
