---
- name: Fetch the pinned Hermes installer with checksum verification
  become: true
  ansible.builtin.get_url:
    url: "{{ hermes_runtime_installer_url }}"
    dest: "{{ hermes_runtime_installer_path }}"
    checksum: "sha256:{{ hermes_runtime_installer_sha256 }}"
    owner: root
    group: root
    mode: "0644"

- name: Run the verified installer for a missing Hermes CLI
  become: true
  ansible.builtin.command:
    argv:
      - bash
      - "{{ hermes_runtime_installer_path }}"
      - --dir
      - "{{ hermes_runtime_install_dir }}"
      - --hermes-home
      - "{{ hermes_runtime_hermes_home }}"
      - --branch
      - "{{ hermes_runtime_version_tag }}"
      - --skip-setup
      - --non-interactive
      - --skip-computer-use
    creates: "{{ hermes_runtime_bin }}"
  # A hung installer fails this host alone instead of stalling every host in the play.
  environment:
    HERMES_HOME: "{{ hermes_runtime_hermes_home }}"
  timeout: "{{ hermes_runtime_installer_timeout }}"

# Upstream PM binds the checkout's launcher to whichever home holds installs/<key>/facts.json for it,
# preferring root's platform-default home; state there from a root-home install would pin the service to
# an interpreter it cannot execute. The key is home-dependent, so root's install state is removed by
# listing the installs directory rather than by a computed key.
- name: Find installer state under root's Hermes home
  become: true
  ansible.builtin.find:
    paths: /root/.hermes/installs
    file_type: directory
    recurse: false
  check_mode: false
  register: hermes_runtime_root_installs
  when: hermes_runtime_hermes_home != '/root/.hermes'

- name: Remove installer state under root's Hermes home
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ hermes_runtime_root_installs.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  when: hermes_runtime_hermes_home != '/root/.hermes'

# Upstream keeps an existing checkout launcher while its interpreter still exists, so a launcher a root-home
# install minted stays bound to root's store. Removing it lets the install stages republish it for the service home.
- name: Find checkout launchers bound to root's Hermes home
  become: true
  ansible.builtin.find:
    paths: "{{ hermes_runtime_install_dir }}/.hermes/bin"
    patterns: [hermes, hermes-acp]
    contains: '.*/root/\.hermes/.*'
  check_mode: false
  register: hermes_runtime_root_bound_launchers
  when: hermes_runtime_hermes_home != '/root/.hermes'

- name: Remove checkout launchers bound to root's Hermes home
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ hermes_runtime_root_bound_launchers.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  when: hermes_runtime_hermes_home != '/root/.hermes'

# Hermes reads its version from git; git refuses the root-owned checkout to any other user without this.
- name: Trust the root-owned Hermes checkout in the system git config
  become: true
  ansible.builtin.blockinfile:
    path: /etc/gitconfig
    create: true
    mode: "0644"
    marker: "# {mark} hermes_runtime checkout"
    block: |
      [safe]
      	directory = {{ hermes_runtime_install_dir }}

- name: Read Hermes CLI version before pinning
  become: true
  become_user: "{{ hermes_runtime_user }}"
  environment:
    HERMES_HOME: "{{ hermes_runtime_hermes_home }}"
  ansible.builtin.command:
    argv:
      - "{{ hermes_runtime_bin }}"
      - --version
  check_mode: false
  changed_when: false
  failed_when: false
  register: hermes_runtime_installed_version_before_pin

- name: Pin the Hermes checkout to the requested release tag
  become: true
  ansible.builtin.git:
    repo: "{{ hermes_runtime_repo_url }}"
    dest: "{{ hermes_runtime_install_dir }}"
    version: "{{ hermes_runtime_version_tag }}"
    refspec: "+refs/tags/{{ hermes_runtime_version_tag }}:refs/tags/{{ hermes_runtime_version_tag }}"
    depth: 1
    force: true
  register: hermes_runtime_checkout
  when:
    - >-
      hermes_runtime_installed_version_before_pin.rc != 0 or
      ('Hermes Agent v' ~ hermes_runtime_version ~ ' (') not in
      (hermes_runtime_installed_version_before_pin.stdout | default(''))
    - not ansible_check_mode or hermes_runtime_installed_version_before_pin.rc == 0

- name: Read the PM-pinned Python from the Hermes checkout
  become: true
  ansible.builtin.slurp:
    src: "{{ hermes_runtime_install_dir }}/pm/lock.json"
  check_mode: false
  register: hermes_runtime_pm_lock
  when:
    - not ansible_check_mode or hermes_runtime_installed_version_before_pin.rc == 0

- name: Read the Python minor of the Hermes runtime virtualenv before pinning
  become: true
  # Upstream PM's own resolver names the venv the service launcher selects under its HERMES_HOME.
  ansible.builtin.command: &hermes_runtime_selected_python_probe
    argv:
      - python3
      - -c
      - >-
        from pathlib import Path; from pm.environments import selected_venv, venv_python_version;
        venv = selected_venv(Path.cwd()); v = venv_python_version(venv);
        print('%d.%d' % v if v else ''); print(venv)
    chdir: "{{ hermes_runtime_install_dir }}"
  environment:
    HERMES_HOME: "{{ hermes_runtime_hermes_home }}"
  check_mode: false
  changed_when: false
  failed_when: false
  register: hermes_runtime_venv_python_before_pin
  when:
    - not ansible_check_mode or hermes_runtime_installed_version_before_pin.rc == 0

- name: Set the PM-pinned Python minor
  ansible.builtin.set_fact:
    hermes_runtime_pm_python: >-
      {{ (hermes_runtime_pm_lock.content | b64decode | from_json).packages.python.version.split('.')[:2] | join('.') }}
  when:
    - not ansible_check_mode or hermes_runtime_installed_version_before_pin.rc == 0

- name: Flag a runtime virtualenv whose Python differs from the PM pin
  ansible.builtin.set_fact:
    hermes_runtime_python_stale: >-
      {{ hermes_runtime_venv_python_before_pin.rc != 0 or
      (hermes_runtime_venv_python_before_pin.stdout_lines | first | default('')) != hermes_runtime_pm_python }}
  when:
    - not ansible_check_mode or hermes_runtime_installed_version_before_pin.rc == 0

# The checkout is already pinned above; the installer's repository stage would fetch
# the tag as a branch, so a rerun runs every other non-interactive stage instead.
- name: Install or upgrade Hermes when the checkout moved or its runtime Python is stale
  become: true
  ansible.builtin.command:
    argv:
      - bash
      - "{{ hermes_runtime_installer_path }}"
      - --dir
      - "{{ hermes_runtime_install_dir }}"
      - --hermes-home
      - "{{ hermes_runtime_hermes_home }}"
      - --stage
      - "{{ item }}"
      - --skip-setup
      - --non-interactive
      - --skip-computer-use
  loop: [prerequisites, venv, python-deps, config, products, complete]
  # Runs only when the version or venv Python is off the pin, so every run changes the install.
  changed_when: true
  environment:
    HERMES_HOME: "{{ hermes_runtime_hermes_home }}"
  timeout: "{{ hermes_runtime_installer_timeout }}"
  when:
    - >-
      hermes_runtime_installed_version_before_pin.rc != 0 or
      ('Hermes Agent v' ~ hermes_runtime_version ~ ' (') not in
      (hermes_runtime_installed_version_before_pin.stdout | default('')) or
      hermes_runtime_python_stale | default(false)
    - not ansible_check_mode or hermes_runtime_installed_version_before_pin.rc == 0

# The installer runs as root, so the tool and dependency state it writes under the service home is root-owned 0600.
- name: Give the service user its Hermes install and tool state
  become: true
  ansible.builtin.file:
    path: "{{ hermes_runtime_hermes_home }}/{{ item }}"
    state: directory
    owner: "{{ hermes_runtime_user }}"
    recurse: true
  loop: [installs, tools]
  when: hermes_runtime_hermes_home != '/root/.hermes'

# Launches stop retrying an unfinished dependency repair after a few attempts; upstream's remedy is `hermes pm repair`.
- name: Find unfinished Hermes dependency repairs
  become: true
  ansible.builtin.find:
    paths: "{{ hermes_runtime_hermes_home }}/installs"
    patterns: [.repair-incomplete]
    hidden: true
    recurse: true
    depth: 2
  check_mode: false
  register: hermes_runtime_repair_markers

- name: Repair the Hermes dependency environment as the service user
  become: true
  become_user: "{{ hermes_runtime_user }}"
  environment:
    HERMES_HOME: "{{ hermes_runtime_hermes_home }}"
  ansible.builtin.command:
    argv:
      - "{{ hermes_runtime_bin }}"
      - pm
      - repair
  changed_when: true
  when: hermes_runtime_repair_markers.matched | default(0) > 0

- name: Read the installed Hermes CLI version
  when:
    - not (ansible_check_mode and hermes_runtime_checkout is changed)
    - not ansible_check_mode or hermes_runtime_installed_version_before_pin.rc == 0
  block:
    - name: Run the Hermes version query as the service user
      become: true
      become_user: "{{ hermes_runtime_user }}"
      environment:
        HERMES_HOME: "{{ hermes_runtime_hermes_home }}"
      ansible.builtin.command:
        argv:
          - "{{ hermes_runtime_bin }}"
          - --version
      check_mode: false
      changed_when: false
      register: hermes_runtime_installed_version
  rescue:
    - name: Collect and report Hermes launcher diagnostics as root
      become: true
      check_mode: false
      block:
        - name: Read the first six lines of the Hermes launcher
          ansible.builtin.command:
            argv:
              - head
              - -n
              - "6"
              - --
              - "{{ hermes_runtime_bin }}"
          changed_when: false
          failed_when: false
          register: hermes_runtime_launcher_head

        - name: Resolve the Hermes launcher target
          ansible.builtin.command:
            argv:
              - readlink
              - -f
              - --
              - "{{ hermes_runtime_bin }}"
          changed_when: false
          failed_when: false
          register: hermes_runtime_launcher_target

        - name: Read the first six lines of the resolved Hermes launcher
          ansible.builtin.command:
            argv:
              - head
              - -n
              - "6"
              - --
              - "{{ hermes_runtime_launcher_target.stdout | default('/nonexistent', true) }}"
          changed_when: false
          failed_when: false
          register: hermes_runtime_launcher_target_head

        - name: Read ownership and modes along the Hermes path chain
          ansible.builtin.command:
            argv:
              - stat
              - -c
              - "%U:%G %a %n"
              - --
              - /root
              - /root/.hermes
              - /root/.hermes/tools
              - "{{ hermes_runtime_hermes_home }}"
              - "{{ hermes_runtime_hermes_home }}/tools"
              - "{{ hermes_runtime_install_dir }}"
              - "{{ hermes_runtime_install_dir }}/.hermes/bin"
          changed_when: false
          failed_when: false
          register: hermes_runtime_launcher_path_stat

        - name: List Hermes install and tool directory names
          ansible.builtin.command:
            argv:
              - ls
              - -la
              - --
              - /root/.hermes/installs
              - "{{ hermes_runtime_hermes_home }}/installs"
              - /root/.hermes/tools
              - "{{ hermes_runtime_hermes_home }}/tools"
          changed_when: false
          failed_when: false
          register: hermes_runtime_launcher_directories

        - name: Read Hermes facts and install stamp JSON files
          ansible.builtin.command:
            argv:
              - find
              - /root/.hermes
              - "{{ hermes_runtime_hermes_home }}"
              - "{{ hermes_runtime_install_dir }}/.hermes"
              - -maxdepth
              - "4"
              - -type
              - f
              - "("
              - -name
              - facts.json
              - -o
              - -name
              - install-stamp.json
              - ")"
              - -exec
              - sh
              - -c
              - 'for path do printf "\n--- %s ---\n" "$path"; cat "$path"; done'
              - sh
              - "{}"
              - +
          changed_when: false
          failed_when: false
          register: hermes_runtime_launcher_install_metadata

        - name: Resolve the Hermes virtualenv Python
          ansible.builtin.command:
            argv:
              - readlink
              - -f
              - --
              - "{{ hermes_runtime_install_dir }}/venv/bin/python"
          changed_when: false
          failed_when: false
          register: hermes_runtime_launcher_venv_python

        - name: Print Hermes launcher diagnostics to the log
          ansible.builtin.debug:
            msg:
              - >-
                Launcher first six lines (rc {{ hermes_runtime_launcher_head.rc | default('unavailable') }}):
                {{ hermes_runtime_launcher_head.stdout | default('') }}
                {{ hermes_runtime_launcher_head.stderr | default('') }}
              - >-
                Launcher resolved target (rc {{ hermes_runtime_launcher_target.rc | default('unavailable') }}):
                {{ hermes_runtime_launcher_target.stdout | default('') }}
                {{ hermes_runtime_launcher_target.stderr | default('') }}
              - >-
                Resolved launcher lines (rc
                {{ hermes_runtime_launcher_target_head.rc | default('unavailable') }}):
                {{ hermes_runtime_launcher_target_head.stdout | default('') }}
                {{ hermes_runtime_launcher_target_head.stderr | default('') }}
              - >-
                Hermes path ownership and modes (rc
                {{ hermes_runtime_launcher_path_stat.rc | default('unavailable') }}):
                {{ hermes_runtime_launcher_path_stat.stdout | default('') }}
                {{ hermes_runtime_launcher_path_stat.stderr | default('') }}
              - >-
                Hermes install and tool directories (rc
                {{ hermes_runtime_launcher_directories.rc | default('unavailable') }}):
                {{ hermes_runtime_launcher_directories.stdout | default('') }}
                {{ hermes_runtime_launcher_directories.stderr | default('') }}
              - >-
                Hermes facts and install stamps (rc
                {{ hermes_runtime_launcher_install_metadata.rc | default('unavailable') }}):
                {{ hermes_runtime_launcher_install_metadata.stdout | default('') }}
                {{ hermes_runtime_launcher_install_metadata.stderr | default('') }}
              - >-
                Hermes virtualenv Python target (rc
                {{ hermes_runtime_launcher_venv_python.rc | default('unavailable') }}):
                {{ hermes_runtime_launcher_venv_python.stdout | default('') }}
                {{ hermes_runtime_launcher_venv_python.stderr | default('') }}

        - name: Fail after recording Hermes launcher diagnostics
          ansible.builtin.fail:
            msg: >-
              Reading {{ hermes_runtime_bin }} --version failed; inspect the preceding
              Hermes launcher diagnostics debug output in the Semaphore log.

- name: Assert the installed CLI reports the pinned release
  ansible.builtin.assert:
    quiet: true
    that:
      - "('Hermes Agent v' ~ hermes_runtime_version ~ ' (') in hermes_runtime_installed_version.stdout"
    fail_msg: >-
      {{ hermes_runtime_bin }} --version reported
      "{{ hermes_runtime_installed_version.stdout | trim }}", which does not
      contain "Hermes Agent v{{ hermes_runtime_version }} (", the pinned release.
  when:
    - not (ansible_check_mode and hermes_runtime_checkout is changed)
    - not ansible_check_mode or hermes_runtime_installed_version_before_pin.rc == 0

- name: Read the Python minor of the Hermes runtime virtualenv after install
  become: true
  ansible.builtin.command: *hermes_runtime_selected_python_probe
  environment:
    HERMES_HOME: "{{ hermes_runtime_hermes_home }}"
  check_mode: false
  changed_when: false
  failed_when: false
  register: hermes_runtime_venv_python
  when:
    - not (ansible_check_mode and hermes_runtime_checkout is changed)
    - not ansible_check_mode or hermes_runtime_installed_version_before_pin.rc == 0

- name: Assert the runtime virtualenv runs the PM-pinned Python
  ansible.builtin.assert:
    quiet: true
    that:
      - hermes_runtime_venv_python.rc == 0
      - (hermes_runtime_venv_python.stdout_lines | first | default('')) == hermes_runtime_pm_python
    fail_msg: >-
      The venv PM selects for {{ hermes_runtime_install_dir }} under {{ hermes_runtime_hermes_home }} reports Python
      "{{ hermes_runtime_venv_python.stdout_lines | default([]) | first | default('') }}"
      (rc {{ hermes_runtime_venv_python.rc | default('none') }}),
      but pm/lock.json pins Python {{ hermes_runtime_pm_python }}.
  when:
    - not (ansible_check_mode and hermes_runtime_checkout is changed)
    - not ansible_check_mode or hermes_runtime_installed_version_before_pin.rc == 0

- name: Publish the PM-selected runtime virtualenv
  ansible.builtin.set_fact:
    hermes_runtime_venv: "{{ hermes_runtime_venv_python.stdout_lines[1] }}"
  when:
    - hermes_runtime_venv_python.stdout_lines | default([]) | length > 1
