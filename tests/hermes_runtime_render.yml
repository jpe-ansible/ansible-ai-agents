---
- name: Check Hermes runtime install task structure
  hosts: localhost
  gather_facts: false
  vars:
    hermes_runtime_version_condition: >-
      hermes_runtime_installed_version_before_pin.rc != 0 or
      ('(' ~ hermes_runtime_version ~ ')') not in
      (hermes_runtime_installed_version_before_pin.stdout | default(''))
    hermes_runtime_check_mode_guard: >-
      not ansible_check_mode or
      hermes_runtime_installed_version_before_pin.rc == 0
  tasks:
    - name: Read Hermes runtime install tasks
      ansible.builtin.set_fact:
        hermes_runtime_install_tasks: >-
          {{ lookup('file', playbook_dir ~ '/../roles/hermes_runtime/tasks/install.yml') | from_yaml }}
        hermes_runtime_main_tasks: >-
          {{ lookup('file', playbook_dir ~ '/../roles/hermes_runtime/tasks/main.yml') | from_yaml }}

    - name: Assert install task order
      ansible.builtin.assert:
        quiet: true
        that:
          - >-
            hermes_runtime_install_tasks | map(attribute='name') | list ==
            [
              'Fetch the pinned Hermes installer with checksum verification',
              'Run the verified installer for a missing Hermes CLI',
              'Read Hermes CLI version before pinning',
              'Pin the Hermes checkout to the requested release tag',
              'Install or upgrade Hermes when the checkout moved',
              'Read the installed Hermes CLI version',
              'Assert the installed CLI reports the pinned release'
            ]

    - name: Select Hermes install and verification tasks
      ansible.builtin.set_fact:
        hermes_runtime_initial_install_task: >-
          {{ hermes_runtime_install_tasks |
          selectattr('name', 'equalto', 'Run the verified installer for a missing Hermes CLI') |
          first }}
        hermes_runtime_pre_pin_version_task: >-
          {{ hermes_runtime_install_tasks |
          selectattr('name', 'equalto', 'Read Hermes CLI version before pinning') |
          first }}
        hermes_runtime_pin_task: >-
          {{ hermes_runtime_install_tasks |
          selectattr('name', 'equalto', 'Pin the Hermes checkout to the requested release tag') |
          first }}
        hermes_runtime_upgrade_task: >-
          {{ hermes_runtime_install_tasks |
          selectattr('name', 'equalto', 'Install or upgrade Hermes when the checkout moved') |
          first }}
        hermes_runtime_postinstall_version_task: >-
          {{ hermes_runtime_install_tasks |
          selectattr('name', 'equalto', 'Read the installed Hermes CLI version') |
          first }}
        hermes_runtime_postinstall_assert_task: >-
          {{ hermes_runtime_install_tasks |
          selectattr('name', 'equalto', 'Assert the installed CLI reports the pinned release') |
          first }}
        hermes_runtime_units_task: >-
          {{ hermes_runtime_main_tasks |
          selectattr('name', 'equalto', 'Deploy Hermes runtime units') |
          first }}

    - name: Assert installer and checkout tasks use the version gate
      ansible.builtin.assert:
        quiet: true
        that:
          - (hermes_runtime_initial_install_task.changed_when | default(false)) != true
          - "'timeout' in hermes_runtime_initial_install_task"
          - hermes_runtime_pre_pin_version_task.register == 'hermes_runtime_installed_version_before_pin'
          - hermes_runtime_pre_pin_version_task.changed_when == false
          - hermes_runtime_pre_pin_version_task.failed_when == false
          - hermes_runtime_pre_pin_version_task.check_mode == false
          - hermes_runtime_pin_task.when | length == 2
          - hermes_runtime_pin_task.when[0] == hermes_runtime_version_condition
          - hermes_runtime_pin_task.when[1] == hermes_runtime_check_mode_guard
          - hermes_runtime_upgrade_task.when | length == 2
          - hermes_runtime_upgrade_task.when[0] == hermes_runtime_version_condition
          - hermes_runtime_upgrade_task.when[1] == hermes_runtime_check_mode_guard
          - (hermes_runtime_upgrade_task.changed_when | default(false)) != true
          - >-
            'hermes_runtime_installed_version_before_pin.rc != 0' in
            hermes_runtime_upgrade_task['ansible.builtin.command'].creates
          - >-
            'not in' in
            hermes_runtime_upgrade_task['ansible.builtin.command'].creates

    - name: Assert post-install verification tasks remain unchanged
      ansible.builtin.assert:
        quiet: true
        that:
          - >-
            hermes_runtime_postinstall_version_task['ansible.builtin.command'].argv[0] ==
            ('{' ~ '{ hermes_runtime_bin }}')
          - hermes_runtime_postinstall_version_task['ansible.builtin.command'].argv[1] == '--version'
          - hermes_runtime_postinstall_version_task.check_mode == false
          - hermes_runtime_postinstall_version_task.changed_when == false
          - hermes_runtime_postinstall_version_task.register == 'hermes_runtime_installed_version'
          - hermes_runtime_postinstall_version_task.when | length == 2
          - >-
            hermes_runtime_postinstall_version_task.when[0] ==
            'not (ansible_check_mode and hermes_runtime_checkout is changed)'
          - hermes_runtime_postinstall_version_task.when[1] == hermes_runtime_check_mode_guard
          - hermes_runtime_postinstall_assert_task['ansible.builtin.assert'].quiet == true
          - >-
            hermes_runtime_postinstall_assert_task['ansible.builtin.assert'].that ==
            ["('(' ~ hermes_runtime_version ~ ')') in hermes_runtime_installed_version.stdout"]
          - >-
            hermes_runtime_postinstall_assert_task['ansible.builtin.assert'].fail_msg ==
            ('{' ~ '{ hermes_runtime_bin }} --version reported "' ~
            '{' ~ '{ hermes_runtime_installed_version.stdout | trim }}", which does not contain "' ~
            '(' ~ '{' ~ '{ hermes_runtime_version }})", the pinned release.')
          - hermes_runtime_postinstall_assert_task.when | length == 2
          - >-
            hermes_runtime_postinstall_assert_task.when[0] ==
            'not (ansible_check_mode and hermes_runtime_checkout is changed)'
          - hermes_runtime_postinstall_assert_task.when[1] == hermes_runtime_check_mode_guard

    - name: Assert unit deployment waits for the first install in check mode
      ansible.builtin.assert:
        quiet: true
        that:
          - hermes_runtime_units_task.when == hermes_runtime_check_mode_guard

- name: Render Hermes runtime systemd units
  hosts: localhost
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    hermes_runtime_user: example-agent
    hermes_runtime_group: example-group
    hermes_runtime_uid: 1001
    hermes_runtime_hermes_home: /var/lib/example.com/.hermes
    hermes_runtime_environment_file: /var/lib/example.com/.hermes/.env
    hermes_runtime_dashboard_web_dist: /usr/local/lib/hermes-agent/hermes_cli/web_dist
    hermes_runtime_dashboard_host: example.com
    hermes_runtime_dashboard_port: 8080
    hermes_runtime_gateway_cmd: /usr/local/bin/hermes gateway run --replace
    hermes_runtime_bin: /usr/local/bin/hermes
    hermes_runtime_unit_restart_interval_sec: 300
    hermes_runtime_unit_restart_burst: 5
    hermes_runtime_restart: always
    hermes_runtime_restart_sec: 5s
    hermes_runtime_unit_on_failure: hermes-unit-alert@%n.service
    hermes_runtime_gateway_environment:
      - name: HERMES_GITHUB_APP_SLUG
        value: example-agent
      - name: HERMES_TRUST_BOUNDARY
        value: example-boundary
    hermes_runtime_dashboard_environment:
      - name: HERMES_DASHBOARD_MODE
        value: interactive
    hermes_runtime_gateway_after_user_manager: true
  tasks:
    - name: Create a temporary unit render directory
      ansible.builtin.tempfile:
        state: directory
        prefix: hermes-runtime-render-
      register: hermes_runtime_render_dir

    - name: Render the configured gateway unit
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/hermes_runtime/templates/hermes-gateway.service.j2"
        dest: "{{ hermes_runtime_render_dir.path }}/hermes-gateway.service"
        mode: "0644"

    - name: Render the configured dashboard unit
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/hermes_runtime/templates/hermes-dashboard.service.j2"
        dest: "{{ hermes_runtime_render_dir.path }}/hermes-dashboard.service"
        mode: "0644"

    - name: Render the gateway unit with all optional directives at defaults
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/hermes_runtime/templates/hermes-gateway.service.j2"
        dest: "{{ hermes_runtime_render_dir.path }}/hermes-gateway-defaults.service"
        mode: "0644"
      vars:
        hermes_runtime_unit_on_failure: ""
        hermes_runtime_gateway_environment: []
        hermes_runtime_gateway_after_user_manager: false

    - name: Render the dashboard unit with all optional directives at defaults
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/hermes_runtime/templates/hermes-dashboard.service.j2"
        dest: "{{ hermes_runtime_render_dir.path }}/hermes-dashboard-defaults.service"
        mode: "0644"
      vars:
        hermes_runtime_unit_on_failure: ""
        hermes_runtime_dashboard_environment: []

    - name: Read the configured and default unit renders
      ansible.builtin.set_fact:
        hermes_runtime_gateway_rendered: >-
          {{ lookup('file', hermes_runtime_render_dir.path ~ '/hermes-gateway.service') }}
        hermes_runtime_dashboard_rendered: >-
          {{ lookup('file', hermes_runtime_render_dir.path ~ '/hermes-dashboard.service') }}
        hermes_runtime_gateway_defaults_rendered: >-
          {{ lookup('file', hermes_runtime_render_dir.path ~ '/hermes-gateway-defaults.service') }}
        hermes_runtime_dashboard_defaults_rendered: >-
          {{ lookup('file', hermes_runtime_render_dir.path ~ '/hermes-dashboard-defaults.service') }}

    - name: Split configured and default units into sections
      ansible.builtin.set_fact:
        hermes_runtime_gateway_unit_section: "{{ hermes_runtime_gateway_rendered.split('[Service]') | first }}"
        hermes_runtime_gateway_service_section: >-
          {{ hermes_runtime_gateway_rendered.split('[Service]')[1].split('[Install]') | first }}
        hermes_runtime_dashboard_unit_section: "{{ hermes_runtime_dashboard_rendered.split('[Service]') | first }}"
        hermes_runtime_dashboard_service_section: >-
          {{ hermes_runtime_dashboard_rendered.split('[Service]')[1].split('[Install]') | first }}
        hermes_runtime_gateway_defaults_unit_section: >-
          {{ hermes_runtime_gateway_defaults_rendered.split('[Service]') | first }}
        hermes_runtime_gateway_defaults_service_section: >-
          {{ hermes_runtime_gateway_defaults_rendered.split('[Service]')[1].split('[Install]') | first }}
        hermes_runtime_dashboard_defaults_unit_section: >-
          {{ hermes_runtime_dashboard_defaults_rendered.split('[Service]') | first }}
        hermes_runtime_dashboard_defaults_service_section: >-
          {{ hermes_runtime_dashboard_defaults_rendered.split('[Service]')[1].split('[Install]') | first }}

    - name: Assert the configured units use the fixed example inputs
      ansible.builtin.assert:
        quiet: true
        that:
          - >-
            'ExecStart=/usr/local/bin/hermes gateway run --replace' in
            hermes_runtime_gateway_rendered
          - "'User=example-agent' in hermes_runtime_gateway_rendered"
          - "'Group=example-group' in hermes_runtime_gateway_rendered"
          - >-
            'EnvironmentFile=-/var/lib/example.com/.hermes/.env' in
            hermes_runtime_gateway_rendered
          - "'Restart=always' in hermes_runtime_gateway_rendered"
          - "'RestartSec=5s' in hermes_runtime_gateway_rendered"
          - >-
            'ExecStart=/usr/local/bin/hermes dashboard --host example.com --port 8080 --no-open' in
            hermes_runtime_dashboard_rendered
          - "'User=example-agent' in hermes_runtime_dashboard_rendered"
          - "'Group=example-group' in hermes_runtime_dashboard_rendered"
          - >-
            'EnvironmentFile=-/var/lib/example.com/.hermes/.env' in
            hermes_runtime_dashboard_rendered
          - "'Restart=always' in hermes_runtime_dashboard_rendered"
          - "'RestartSec=5s' in hermes_runtime_dashboard_rendered"

    - name: Assert configured optional directives appear once in their sections
      ansible.builtin.assert:
        quiet: true
        that:
          - >-
            hermes_runtime_gateway_unit_section |
            regex_findall('(?m)^OnFailure=hermes-unit-alert@%n\\.service$') | length == 1
          - >-
            hermes_runtime_dashboard_unit_section |
            regex_findall('(?m)^OnFailure=hermes-unit-alert@%n\\.service$') | length == 1
          - >-
            hermes_runtime_gateway_unit_section |
            regex_findall('(?m)^After=user@1001\\.service$') | length == 1
          - >-
            hermes_runtime_gateway_unit_section |
            regex_findall('(?m)^Wants=user@1001\\.service$') | length == 1
          - >-
            hermes_runtime_gateway_service_section |
            regex_findall('(?m)^Environment=HERMES_GITHUB_APP_SLUG=example-agent$') |
            length == 1
          - >-
            hermes_runtime_gateway_service_section |
            regex_findall('(?m)^Environment=HERMES_TRUST_BOUNDARY=example-boundary$') |
            length == 1
          - >-
            hermes_runtime_gateway_service_section.index('Environment=HERMES_HOME=') <
            hermes_runtime_gateway_service_section.index('Environment=HERMES_GITHUB_APP_SLUG=')
          - >-
            hermes_runtime_gateway_service_section.index('Environment=HERMES_GITHUB_APP_SLUG=') <
            hermes_runtime_gateway_service_section.index('Environment=HERMES_TRUST_BOUNDARY=')
          - >-
            hermes_runtime_dashboard_service_section |
            regex_findall('(?m)^Environment=HERMES_DASHBOARD_MODE=interactive$') | length == 1
          - >-
            hermes_runtime_dashboard_service_section.index('Environment=HERMES_HOME=') <
            hermes_runtime_dashboard_service_section.index('Environment=HERMES_DASHBOARD_MODE=')
          - >-
            hermes_runtime_dashboard_service_section.index('Environment=HERMES_DASHBOARD_MODE=') <
            hermes_runtime_dashboard_service_section.index('Environment=HERMES_WEB_DIST=')

    - name: Assert optional directives are absent with default values
      ansible.builtin.assert:
        quiet: true
        that:
          - "'OnFailure=' not in hermes_runtime_gateway_defaults_unit_section"
          - "'OnFailure=' not in hermes_runtime_dashboard_defaults_unit_section"
          - "'After=user@1001.service' not in hermes_runtime_gateway_defaults_unit_section"
          - "'Wants=user@1001.service' not in hermes_runtime_gateway_defaults_unit_section"
          - >-
            'Environment=HERMES_GITHUB_APP_SLUG=' not in
            hermes_runtime_gateway_defaults_service_section
          - >-
            'Environment=HERMES_TRUST_BOUNDARY=' not in
            hermes_runtime_gateway_defaults_service_section
          - >-
            'Environment=HERMES_GITHUB_APP_SLUG=' not in
            hermes_runtime_dashboard_defaults_service_section
          - >-
            'Environment=HERMES_TRUST_BOUNDARY=' not in
            hermes_runtime_dashboard_defaults_service_section
          - >-
            'Environment=HERMES_DASHBOARD_MODE=' not in
            hermes_runtime_dashboard_defaults_service_section

    - name: Assert source-template unit lines remain present
      ansible.builtin.assert:
        quiet: true
        that:
          - "'StartLimitIntervalSec=300' in hermes_runtime_gateway_rendered"
          - "'StartLimitBurst=5' in hermes_runtime_gateway_rendered"
          - "'WorkingDirectory=/var/lib/example.com/.hermes' in hermes_runtime_gateway_rendered"
          - >-
            'Environment=HERMES_HOME=/var/lib/example.com/.hermes' in
            hermes_runtime_gateway_rendered
          - >-
            'Description=Hermes Dashboard (authenticated interactive UI)' in
            hermes_runtime_dashboard_rendered
          - >-
            'After=network-online.target hermes-gateway.service' in
            hermes_runtime_dashboard_rendered
          - "'StartLimitIntervalSec=300' in hermes_runtime_dashboard_rendered"
          - "'StartLimitBurst=5' in hermes_runtime_dashboard_rendered"
          - >-
            'Environment=HERMES_WEB_DIST=/usr/local/lib/hermes-agent/hermes_cli/web_dist' in
            hermes_runtime_dashboard_rendered

    - name: Remove the temporary render directory
      ansible.builtin.file:
        path: "{{ hermes_runtime_render_dir.path }}"
        state: absent

- name: Check Hermes runtime entrypoint argument validation
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Initialize expected rejection flags
      ansible.builtin.set_fact:
        hermes_runtime_contract_main: false
        hermes_runtime_contract_units: false

    - name: Negative case - main entry point requires unit inputs
      block:
        - name: Run the main entry point without required unit inputs
          ansible.builtin.include_role:
            name: hermes_runtime
      rescue:
        - name: Confirm main entry point rejection
          ansible.builtin.assert:
            that: "'hermes_runtime_user' in ansible_failed_result.msg"
          no_log: true
        - name: Record main entry point rejection
          ansible.builtin.set_fact:
            hermes_runtime_contract_main: true

    - name: Negative case - units entry point requires a service user
      block:
        - name: Run the units entry point without a service user
          ansible.builtin.include_role:
            name: hermes_runtime
            tasks_from: units
      rescue:
        - name: Confirm units entry point rejection
          ansible.builtin.assert:
            that: "'hermes_runtime_user' in ansible_failed_result.msg"
          no_log: true
        - name: Record units entry point rejection
          ansible.builtin.set_fact:
            hermes_runtime_contract_units: true

    - name: Confirm every entry point rejected its invalid input
      ansible.builtin.assert:
        quiet: true
        that:
          - hermes_runtime_contract_main
          - hermes_runtime_contract_units
